name: Android build

on:
  push:
    branches: [ main, 'foundation/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install E2E dependencies
        run: npm install --audit=true --fund=false
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  android-unit-and-instrumented:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate project governance
        run: node tools/validate-project-governance.js
      - name: Validate security contracts
        run: node tools/test-security-contracts.js
      - name: Validate terminal policy
        run: node tools/test-terminal-policy.js
      - name: Validate language runtime
        run: node tools/test-language-runtime.js
      - name: Validate snippet registry
        run: node tools/test-snippet-registry.js
      - name: Validate diagnostics provider
        run: node tools/test-diagnostics.js
      - name: Validate all JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find app/src/main/assets -type f -name '*.js' -print0)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35 and emulator image
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
      - name: Create emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd -n vsac-api35 -k 'system-images;android-35;google_apis;x86_64' --device 'pixel_2'
      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd vsac-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/vsac-emulator.log 2>&1 &
          adb wait-for-device
          until adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; do sleep 2; done
          adb shell input keyevent 82
      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run Android instrumented E2E tests
        run: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-instrumented-results
          path: app/build/outputs/androidTest-results
          if-no-files-found: ignore
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-studio-acode-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
